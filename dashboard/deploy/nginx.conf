# =============================================================================
# nginx.conf — A股涨停直播看板的 nginx 反向代理（Caddy 的替代方案，二选一）
#
# 本文件在 compose 中的挂载点：/etc/nginx/conf.d/default.conf
# 切换步骤（见 DEPLOY.md §9）：
#   docker compose stop caddy
#   docker compose --profile nginx up -d nginx
#
# 与 Caddy 的差异：
#   * nginx 不自动申请 TLS 证书：需要 HTTPS 请自行用 certbot / 云厂商证书，
#     并在文件末尾的 server 443 段填证书路径（默认整段注释）。
#   * 基础认证/basic auth、限流需手动开启（见下）。
# =============================================================================

upstream limitup_app {
    server app:8000;
    keepalive 16;
}

# 可选：简单按 IP 限流（默认注释；取消注释即生效）。
# 注意：limit_req_zone 与 limit_req 必须同时启用，否则 nginx 启动失败。
# limit_req_zone $binary_remote_addr zone=limitup_api:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ---- gzip 压缩 ----
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    client_max_body_size 1m;
    # 页面无上传/长连接，保持默认即可

    # ---- 可选：HTTP Basic Auth（与 app 层 LIMITUP_ACCESS_CODE 可叠加） ----
    # 生成密码文件：
    #   docker run --rm httpd:alpine htpasswd -nbB admin 'your-password' > deploy/.htpasswd
    # 然后取消 compose 中 .htpasswd 挂载 + 下面两行注释：
    # auth_basic "A股涨停看板";
    # auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # 健康检查不写访问日志
    location = /api/health {
        access_log off;
        proxy_pass http://limitup_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        # 可选限流（与文件顶部 limit_req_zone 一起启用）：
        # limit_req zone=limitup_api burst=20 nodelay;

        proxy_pass http://limitup_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 配合 app 的 LIMITUP_TRUST_PROXY=1（compose 默认注入），限流/日志按真实客户端 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/snapshot 首次加载最长约 20s，/api/refresh 最长约 30s
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # 快照 JSON 直接透传，减少首屏等待
        proxy_buffering off;
    }
}

