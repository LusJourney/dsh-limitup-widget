# =============================================================================
# A股涨停直播看板 — Docker Compose 编排（app + Caddy 反向代理）
#
# 默认用法（都在 deploy/ 目录下执行）：
#   cp .env.example .env      # 首次
#   ./deploy.sh up            # 构建 + 启动 + 健康检查 + 冒烟测试
#
# 也可以直接：
#   cd deploy && docker compose up -d --build
#
# 说明：
#   * app.py 是**单实例**应用（进程内后台刷新线程 + akshare 全局节流），
#     不要 `--scale app=N` / 不要部署多副本，否则会重复拉取数据源。
#   * 公网只暴露 80/443（Caddy）；app 的 8000 只在容器网络内可见。
#   * 数据（CSV 快照 / 交易日历 / 概念缓存）落在命名卷 app-data，容器重建不丢。
# =============================================================================
name: ashare-limitup

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ashare-limitup:local
    restart: unless-stopped
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      TZ: ${TZ:-Asia/Shanghai}
      # ---- 可选安全加固（默认关闭；需最新 app.py 支持，旧版会忽略这两个变量）----
      LIMITUP_ACCESS_CODE: ${LIMITUP_ACCESS_CODE:-}
      LIMITUP_RATE_LIMIT: ${LIMITUP_RATE_LIMIT:-}
      # 本服务一定在 Caddy/nginx 之后：信任 X-Forwarded-For，限流才按真实客户端 IP
      LIMITUP_TRUST_PROXY: ${LIMITUP_TRUST_PROXY:-1}
      # /api/refresh 每 IP 冷却秒数（0=关闭）
      LIMITUP_REFRESH_COOLDOWN: ${LIMITUP_REFRESH_COOLDOWN:-10}
    volumes:
      - app-data:/app/data
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # 由 deploy.sh 按 .env 的 DOMAIN 自动推导：
      #   有域名 -> https://<domain>，Caddy 自动申请/续期 Let's Encrypt 证书
      #   无域名 -> :80，仅 HTTP 明文
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 可选：用 nginx 代替 Caddy（默认不启动，见 DEPLOY.md §9）
  #   docker compose stop caddy
  #   docker compose --profile nginx up -d nginx
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 可选 HTTP Basic Auth：先 `htpasswd -nbB admin '密码' > .htpasswd`
      # 再取消下一行注释 + nginx.conf 里 auth_basic 两行注释
      # - ./.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
  caddy-data:
  caddy-config:
